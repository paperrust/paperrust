# PaperRust auf dem NAS – Projekt-/Stack-Datei für
#   Synology Container Manager (DSM 7.2+, "Projekt"), UGREEN NAS (UGOS Pro, App "Docker" -> "Projekt"),
#   Asustor (ADM, App "Portainer CE" -> "Stacks") und jede andere Oberfläche mit docker compose.
# Anleitung: docker/nas/README.md
#
# Zwei Container: paperrust (Webserver, Worker, Zeitplaner, Eingangsordner in einem Prozess) und
# PostgreSQL. Kein Redis, kein Tika, kein Gotenberg.
#
# VOR DEM ERSTEN START die drei mit "ÄNDERN" markierten Werte setzen.
#
# Ordner: standardmäßig neben dieser Datei (Synology/UGREEN legen das Projekt in einem eigenen
# Ordner an, z. B. /volume1/docker/paperrust). Portainer (Asustor) kennt keine relativen Pfade:
# dort die Umgebungsvariable PAPERRUST_DIR=/volume1/Docker/paperrust im Stack setzen.

services:
  db:
    image: docker.io/library/postgres:17
    container_name: paperrust-db
    restart: unless-stopped
    volumes:
      - ${PAPERRUST_DIR:-.}/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: &dbpass change-me-db-password   # ÄNDERN (1/3)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 10s
      timeout: 5s
      retries: 10

  paperrust:
    # Image: einzige Stelle zum Ändern (oder Variable PAPERRUST_IMAGE; alle NAS-Vorlagen auf einmal:
    # docker/nas/set-image.sh <image>)
    image: ${PAPERRUST_IMAGE:-ghcr.io/paperrust/paperrust:latest}
    container_name: paperrust
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Startet als root, übernimmt PUID/PGID (bzw. USERMAP_UID/GID), gibt danach die Rechte ab.
    user: "0:0"
    ports:
      - "8000:8000"          # links den NAS-Port ändern, falls 8000 belegt ist
    volumes:
      - ${PAPERRUST_DIR:-.}/data:/usr/src/paperless/data
      - ${PAPERRUST_DIR:-.}/media:/usr/src/paperless/media
      - ${PAPERRUST_DIR:-.}/consume:/usr/src/paperless/consume
      - ${PAPERRUST_DIR:-.}/export:/usr/src/paperless/export
    environment:
      # Eigentümer der Dateien in data/media/consume/export: UID/GID des NAS-Benutzers, dem die
      # Ordner gehören (Synology: `id <benutzer>` per SSH, oft 1026:100; UGREEN/Asustor oft 1000:100)
      PUID: "1000"
      PGID: "100"
      # lange Zufallszeichenkette (z. B. `openssl rand -base64 48`); beim Umstieg von paperless-ngx
      # denselben Wert wie dort übernehmen
      PAPERRUST_SECRET_KEY: change-me-long-random-string   # ÄNDERN (2/3)
      PAPERRUST_DBHOST: db
      PAPERRUST_DBNAME: paperless
      PAPERRUST_DBUSER: paperless
      PAPERRUST_DBPASS: *dbpass
      PAPERRUST_TIME_ZONE: Europe/Berlin
      PAPERRUST_OCR_LANGUAGE: deu+eng
      # erster Administrator (wird beim Start angelegt, falls er fehlt); danach darf es stehen bleiben
      PAPERRUST_ADMIN_USER: admin
      PAPERRUST_ADMIN_PASSWORD: change-me-admin-password  # ÄNDERN (3/3)
      # Adresse, unter der PaperRust erreichbar ist (nötig hinter einem Reverse Proxy mit HTTPS)
      #PAPERRUST_URL: https://paperrust.example.com
      # Eingangsordner auf NAS-Freigaben: Änderungen werden oft nicht gemeldet -> abfragen
      PAPERRUST_CONSUMER_POLLING_INTERVAL: "10"
    # laufende Aufgaben bekommen 30 s zum Abschließen
    stop_grace_period: 45s
    # Healthcheck ist im Image eingebaut (GET /__rs/health im Container); hier nur zur Anzeige
    # in Oberflächen, die ihn sonst nicht übernehmen.
    healthcheck:
      test: ["CMD", "/usr/local/bin/paperrust-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
