# PaperRust Routen-Schalter (optional).
#
# Seit 2026-11-14 bedient PaperRust jede Route selbst; eine Weiterleitung an Django gibt es nicht mehr.
# Diese Datei kann Routen nur noch abschalten:
#   "off"           = Route wird nicht eingehaengt (Antwort 404 wie fuer jeden unbekannten Pfad)
#   "rust" / "on"   = Route ist an (gleichbedeutend)
#   nicht genannt   = an (Standard)
#   "django"        = alter Wert, wird mit Warnung als "an" gelesen
# Unbekannte ids sind ein Startfehler. PAPERRUST_ROUTES zeigt auf die Datei; fehlt sie, laufen alle
# Routen (Fehler nur, wenn PAPERRUST_ROUTES sie ausdruecklich nennt).
#
# Die Eintraege unten sind Geschichte (Freigabeliste aus dem Abgleich gegen Django v3.4.2) und harmlos:
#   Lesen  1787/1797 identisch, 0 Fehler (results/parity/full/2026-11-08_163716.md + Fixes W19)
#   Schreiben 515/521 identisch, 0 Fehler (results/parity/w21/2026-11-08_204902.md)
#   Rest: freigegebene Regeln in tests/parity/accepted.json.
#
# Beispiel zum Abschalten einer Route:
#   "documents.email" = "off"

