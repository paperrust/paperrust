[package]
name = "pl-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `server`: integration with pl-core/pl-authz/PostgreSQL (ApiRoute, token login, DB backend).
# Without `server` the pure libraries (matching, prompts, schema, LLM client,
# MCP protocol with storage backend) stay usable and testable.
default = ["server"]
server = ["dep:pl-core", "dep:pl-authz", "dep:sqlx", "dep:sea-query", "dep:sea-query-binder", "dep:pl-search", "dep:pl-objects"]

[dependencies]
pl-core = { workspace = true, optional = true }
pl-authz = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
sea-query = { workspace = true, optional = true }
sea-query-binder = { workspace = true, optional = true }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
unicode-normalization.workspace = true
regex.workspace = true
sha2.workspace = true
bytes.workspace = true
base64.workspace = true
pl-search = { workspace = true, optional = true, default-features = false, features = ["routes"] }
pl-objects = { workspace = true, optional = true }
# --- not in [workspace.dependencies] (CORE-REQUEST, pinned versions) ---
# BPE tokenizer cl100k_base like tiktoken 0.12 (llama_index get_tokenizer)
tiktoken-rs = "=0.12.1"
# Vector index in the upstream format (SQLite + sqlite-vec 0.1.9, both built statically)
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sqlite-vec = "=0.1.9"

[dev-dependencies]
# reference parity test parity_w8 only: clear the cache of the reference Django instance (Garnet)
redis.workspace = true
tower.workspace = true
tokio.workspace = true
