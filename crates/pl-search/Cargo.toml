[package]
name = "pl-search"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["routes"]
# `routes()` needs pl-core; the engine (backend/query/views) does not.
routes = ["dep:pl-core", "dep:pl-authz", "dep:pl-objects", "dep:pl-workflows", "dep:pl-auth-api", "dep:sea-query", "dep:sea-query-binder"]

[dependencies]
pl-core = { workspace = true, optional = true }
pl-authz = { workspace = true, optional = true }
# global search sections (serializers of tags/…, workflows, users/groups)
pl-objects = { workspace = true, optional = true }
pl-workflows = { workspace = true, optional = true }
pl-auth-api = { workspace = true, optional = true }
sea-query = { workspace = true, optional = true }
sea-query-binder = { workspace = true, optional = true }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
regex.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio.workspace = true
tantivy.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
tempfile.workspace = true
