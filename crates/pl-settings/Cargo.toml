[package]
name = "pl-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Schema registry, layering (environment/DB/file/default), storage `paperrust_setting`
# (encrypted secrets) and live reload. docs/SETTINGS.md (WP1–WP3). Without axum.
[dependencies]
pl-core.workspace = true
# Crontab check with the same parser as the scheduler (docs/SETTINGS.md §2.4).
pl-queue.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
url.workspace = true
regex.workspace = true
sha2.workspace = true
rand.workspace = true
# App logo (logo.rs): re-encode raster images, check SVG (v1 + v2).
image.workspace = true
quick-xml.workspace = true
# Export with passphrase (§2.7)
pbkdf2.workspace = true
base64.workspace = true
# Secrets: XChaCha20-Poly1305, key via HKDF-SHA256 from SECRET_KEY (§2.3).
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = "0.12.4"
# Snapshot per process (§2.5).
arc-swap = "1.9.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
