{% extends "layout.html" %}
{% set page_title = t("auth.page.reset") %}
{% block body %}
    <p class="muted">{{ t("auth.reset.intro") }}</p>
    <form id="form-account" method="post">
      {{ csrf_input }}
      <div class="field">
        <label for="inputEmail">{{ t("auth.field.email") }}</label>
        <input type="email" name="{{ form.email.name }}" id="inputEmail" autocomplete="email" required autofocus>
      </div>
      <button class="btn" type="submit">{{ t("auth.reset.submit") }}</button>
    </form>
    <div class="links"><p><a href="{{ urls.account_login }}">{{ t("auth.common.to_login") }}</a></p></div>
{% endblock %}
