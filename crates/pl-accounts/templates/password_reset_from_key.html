{% extends "layout.html" %}
{% set page_title = t("auth.page.reset_key") %}
{% block body %}
    {%- if token_fail %}
    <p>{{ t("auth.reset_key.invalid") }}</p>
    <a class="btn" href="{{ urls.account_reset_password }}">{{ t("auth.reset_key.request_new") }}</a>
    {%- else %}
    <p class="muted">{{ t("auth.reset_key.intro") }}</p>
    <form id="form-account" method="post">
      {{ csrf_input }}
      <div class="field">
        <label for="inputPassword1">{{ t("auth.field.new_password") }}</label>
        <input type="password" name="{{ form.password1.name }}" id="inputPassword1" autocomplete="new-password" required autofocus>
      </div>
      <div class="field">
        <label for="inputPassword2">{{ t("auth.field.new_password_again") }}</label>
        <input type="password" name="{{ form.password2.name }}" id="inputPassword2" autocomplete="new-password" required>
      </div>
      <button class="btn" type="submit">{{ t("auth.reset_key.submit") }}</button>
    </form>
    {%- endif %}
{% endblock %}
