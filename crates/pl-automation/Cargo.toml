[package]
name = "pl-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# PaperRust area "Automatik" (docs/WORKFLOWS-NEU.md): API under /rs/api/v2/automation – dry run,
# history, else branch, AI condition, suggestions from the archive, mail as trigger, summary.
# Contract: docs/contract/automation.md. Execution stays in pl-consumer (workflow_ext/workflow_dryrun).
[features]
default = ["ai"]
# AI condition (pl-ai ai_verdict) and "workflow from description" (pl-ai workflow_draft).
ai = ["dep:pl-ai"]

[dependencies]
pl-core.workspace = true
pl-authz.workspace = true
pl-consumer.workspace = true
pl-workflows.workspace = true
pl-mail.workspace = true
pl-matching.workspace = true
pl-ai = { workspace = true, optional = true }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
sea-query.workspace = true
sea-query-binder.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tracing.workspace = true
futures.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio.workspace = true
# DB test of the API path "document updated" (run_updated)
pl-documents-write.workspace = true
