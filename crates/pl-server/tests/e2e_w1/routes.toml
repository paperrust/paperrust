# PaperRust route switch (owned by the server agent / coordinator).
#
# Each Rust route has a stable id (see `routes()` of the crates and docs/contract/*.md).
# Value: "rust" = served by PaperRust, "django" = proxied to Django (the default).
# Unknown ids are a startup error. Activate a route only when its parity diff is 0.
#
# Example:
#   "tags.list" = "rust"

[routes]

# Wave 1, read paths with proven parity (coordinator 2026-11-08). Write paths follow after the harness write run.
