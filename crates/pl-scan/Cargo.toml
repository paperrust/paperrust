[package]
name = "pl-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Scanner integration without NAS access on the device (docs/contract/pl-scan.md):
# * eSCL/AirScan client (scan button in PaperRust), mDNS discovery (own minimal implementation)
# * SMTP intake for devices only (scan-to-email), device token only for uploading
# Both paths hand a file to the normal ingestion pipeline (`consume_file`).
# All dependencies from [workspace.dependencies].
