# Re-creates an existing release as github-actions[bot]: same tag, same files, same notes.
# Used once for 0.1.0/0.1.1, which were created with a personal token (author shown on GitHub).
# Download counts start again at 0. The tag itself is kept.
name: Release reissue

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.1.0)"
        required: true
      latest:
        description: "Mark as latest release afterwards"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  reissue:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Save files, notes and title of the existing release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
          mkdir out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body >notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name >title.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort >expected.txt
          (cd out && for f in *; do echo "$f $(stat -c %s "$f")"; done) | sort >got.txt
          diff expected.txt got.txt
          if [ -f out/SHA256SUMS.txt ]; then (cd out && sha256sum -c --ignore-missing SHA256SUMS.txt); fi
          if [ -f out/SHA256SUMS ]; then (cd out && sha256sum -c --ignore-missing SHA256SUMS); fi
          cat expected.txt
      # Safety copy: if creating fails after the delete, the files are still here for 30 days.
      - uses: actions/upload-artifact@v7
        with:
          name: reissue-${{ inputs.tag }}
          path: |
            out/
            notes.md
            title.txt
          retention-days: 30
      - name: Re-create as github-actions[bot] (tag kept)
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          echo "tag $TAG -> $sha"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          latest=--latest=false
          if [ "${{ inputs.latest }}" = true ]; then latest=--latest; fi
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$(cat title.txt)" --notes-file notes.md "$latest"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json author,assets --jq '"author: \(.author.login), files: \(.assets | length)"'
