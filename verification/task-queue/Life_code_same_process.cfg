\* Code as it is with both runners in ONE worker process (concurrency 2, same locked_by name; also the in-process worker-pool restart). Assumption BoundedStale. Expected: pass.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
    Runners = {"a", "b"}
    SameProcess = TRUE
    MaxDeliveries = 2
    MaxCrashes = 2
    MaxRetries = 1
    AllowRevoke = TRUE
    AllowAppend = FALSE
    BoundedPrestart = TRUE
    BoundedStale = TRUE
    UseHbFence = TRUE
    UseFinishFence = TRUE
    ReaperFails = TRUE
    UseToken = TRUE
    UseFencedStart = TRUE
INVARIANTS
    TypeOK
    TerminalOnce
    StatusConsistent
PROPERTIES
    Finishes
    StatusSettles
