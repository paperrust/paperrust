\* Code as it is: two worker processes, crashes/shutdowns, retry, API revoke, any delays; assumption: no pause of a whole lease between claim and mark_started. Expected: pass.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
    Runners = {"a", "b"}
    SameProcess = FALSE
    MaxDeliveries = 2
    MaxCrashes = 2
    MaxRetries = 1
    AllowRevoke = TRUE
    AllowAppend = FALSE
    BoundedPrestart = TRUE
    BoundedStale = FALSE
    UseHbFence = TRUE
    UseFinishFence = TRUE
    ReaperFails = TRUE
    UseToken = TRUE
    UseFencedStart = TRUE
INVARIANTS
    TypeOK
    TerminalOnce
    StatusConsistent
PROPERTIES
    Finishes
    StatusSettles
