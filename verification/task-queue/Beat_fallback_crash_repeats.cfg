\* Documented at-least-once of the fallback path: crash after the separate enqueue, before our COMMIT -> the slot is enqueued again. Expected: NoSlotTwice violated.
SPECIFICATION Spec
CONSTANTS
    Schedulers = {"s1", "s2", "s3"}
    SkewMax = 1
    Period = 2
    MaxT = 4
    UseForUpdate = TRUE
    Mode = "fallback"
    EnqFail = FALSE
    Crash = TRUE
INVARIANTS
    TypeOK
    NoSlotTwice
