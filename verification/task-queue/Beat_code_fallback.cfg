\* run_due with a queue without enqueue_in_conn (separate enqueue while the row lock is held), errors and crashes. Expected: no run lost (pass); a crash between the two commits repeats a run (Beat_fallback_crash_repeats).
SPECIFICATION Spec
CONSTANTS
    Schedulers = {"s1", "s2", "s3"}
    SkewMax = 1
    Period = 2
    MaxT = 4
    UseForUpdate = TRUE
    Mode = "fallback"
    EnqFail = TRUE
    Crash = TRUE
INVARIANTS
    TypeOK
    NoLostSlot
