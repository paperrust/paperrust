\* Deeper bounds for Life_code (3 deliveries, 2 crashes/shutdowns). Expected: pass.
SPECIFICATION FairSpec
CHECK_DEADLOCK TRUE
CONSTANTS
    Runners = {"a", "b"}
    SameProcess = FALSE
    MaxDeliveries = 3
    MaxCrashes = 2
    MaxRetries = 1
    AllowRevoke = TRUE
    AllowAppend = FALSE
    BoundedPrestart = TRUE
    BoundedStale = FALSE
    UseHbFence = TRUE
    UseFinishFence = TRUE
    ReaperFails = TRUE
    UseToken = TRUE
    UseFencedStart = TRUE
INVARIANTS
    TypeOK
    TerminalOnce
    StatusConsistent
PROPERTIES
    Finishes
    StatusSettles
