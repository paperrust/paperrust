\* Proposed fix for the Upload_code finding: assign_folder's SELECT .. FOR KEY SHARE. 3 requests.
SPECIFICATION Spec
CONSTANTS
  Folders = {1, 2, 3}
  Docs = {1}
  NProcs = 3
  Kinds = {"delete", "consume", "movedocs"}
  AllTrees = FALSE
  Tree <- TreeOneChild
  AllPlacements = TRUE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = TRUE
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
