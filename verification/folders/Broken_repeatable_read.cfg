\* Broken: REPEATABLE READ instead of READ COMMITTED (snapshot taken before the lock wait).
\* Only the cycle property is checked: without the lock a deadlock (40P01 -> 500) is often found first,
\* that one is not the point here.
SPECIFICATION Spec
CONSTANTS
  Folders = {f1, f2, f3, f4}
  Docs = {}
  NProcs = 2
  Kinds = {"patchmove", "patchroot", "delete"}
  AllTrees = TRUE
  Tree <- TreeFlat
  AllPlacements = FALSE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = TRUE
  AssignKeyShare = FALSE
SYMMETRY FolderPerms
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
