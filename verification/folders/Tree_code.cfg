\* Folder tree as the code is: PATCH parent / PATCH parent null / DELETE, 2 concurrent requests,
\* every starting forest of 4 folders (4 are needed: with 3, two concurrent moves always share a row lock).
SPECIFICATION Spec
CONSTANTS
  Folders = {f1, f2, f3, f4}
  Docs = {}
  NProcs = 2
  Kinds = {"patchmove", "patchroot", "delete"}
  AllTrees = TRUE
  Tree <- TreeFlat
  AllPlacements = FALSE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = FALSE
  MoveTx = TRUE
  DelLocks = TRUE
SYMMETRY FolderPerms
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
  NoStaleAuthz
  MovesChecked
