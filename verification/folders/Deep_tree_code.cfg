\* Like Tree_code with 3 concurrent requests on 3 folders (lock chains, 3-way deadlocks). run.sh --deep.
SPECIFICATION Spec
CONSTANTS
  Folders = {f1, f2, f3}
  Docs = {}
  NProcs = 3
  Kinds = {"patchmove", "patchroot", "delete"}
  AllTrees = TRUE
  Tree <- TreeFlat
  AllPlacements = FALSE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = FALSE
SYMMETRY FolderPerms
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
