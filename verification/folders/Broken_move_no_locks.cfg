\* Broken = move_documents before 2026-11-27: folder/document checks on the pool, then one autocommit
\* write. A share/owner change committed between check and write is not seen -> NoStaleAuthz.
SPECIFICATION Spec
CONSTANTS
  Folders = {1, 2, 3}
  Docs = {1}
  NProcs = 2
  Kinds = {"movedocs", "unsharef", "unsharedoc"}
  AllTrees = FALSE
  Tree <- TreeOneChild
  AllPlacements = TRUE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = TRUE
  MoveTx = FALSE
  DelLocks = TRUE
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
  NoStaleAuthz
  MovesChecked
