\* Permission checks of move-documents / DELETE with contents vs concurrent share and owner changes
\* (PATCH /folders/{id} permissions, document owner/set_permissions), code as it is: target FOR SHARE,
\* documents FOR SHARE, subfolders FOR UPDATE, checks and write in one transaction. 2 requests,
\* folder 2 inside 1, 3 top level, 1 document in every placement.
SPECIFICATION Spec
CONSTANTS
  Folders = {1, 2, 3}
  Docs = {1}
  NProcs = 2
  Kinds = {"delete", "movedocs", "unsharef", "unsharedoc", "patchmove", "patchroot"}
  AllTrees = FALSE
  Tree <- TreeOneChild
  AllPlacements = TRUE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = TRUE
  MoveTx = TRUE
  DelLocks = TRUE
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
  NoStaleAuthz
  MovesChecked
