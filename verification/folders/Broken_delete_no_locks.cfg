\* Broken: delete without tree_lock and without FOR UPDATE; a concurrent PATCH adds a subfolder
\* after the subfolders were moved -> FK error on DELETE (500).
SPECIFICATION Spec
CONSTANTS
  Folders = {f1, f2, f3}
  Docs = {}
  NProcs = 2
  Kinds = {"delete", "patchmove"}
  AllTrees = TRUE
  Tree <- TreeFlat
  AllPlacements = FALSE
  DocIn <- NoDocIn
  UseTreeLock = FALSE
  DelTreeLock = FALSE
  LockAfterCheck = FALSE
  UseRowLock = FALSE
  RepeatableRead = FALSE
  AssignKeyShare = FALSE
SYMMETRY FolderPerms
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
