\* Like Docs_code with 3 concurrent requests and 1 document (in every placement). run.sh --deep.
SPECIFICATION Spec
CONSTANTS
  Folders = {1, 2, 3}
  Docs = {1}
  NProcs = 3
  Kinds = {"delete", "movedocs", "patchmove", "patchroot"}
  AllTrees = FALSE
  Tree <- TreeOneChild
  AllPlacements = TRUE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = FALSE
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
