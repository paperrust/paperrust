\* Broken: check_contents_movable with plain reads (no FOR UPDATE on subfolders, no FOR SHARE on the
\* parent and the documents). A share/owner change commits between check and write -> NoStaleAuthz.
SPECIFICATION Spec
CONSTANTS
  Folders = {1, 2, 3}
  Docs = {1}
  NProcs = 2
  Kinds = {"delete", "unsharef", "unsharedoc"}
  AllTrees = FALSE
  Tree <- TreeOneChild
  AllPlacements = TRUE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = TRUE
  MoveTx = TRUE
  DelLocks = FALSE
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
  NoStaleAuthz
  MovesChecked
