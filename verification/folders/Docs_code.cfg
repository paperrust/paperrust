\* Documents as the code is: DELETE (both contents modes), move-documents, PATCH, 2 requests,
\* folder 2 inside 1, 3 top level, 2 documents in every placement.
SPECIFICATION Spec
CONSTANTS
  Folders = {1, 2, 3}
  Docs = {1, 2}
  NProcs = 2
  Kinds = {"delete", "movedocs", "patchmove", "patchroot"}
  AllTrees = FALSE
  Tree <- TreeOneChild
  AllPlacements = TRUE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = FALSE
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
