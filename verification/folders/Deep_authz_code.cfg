\* Like Authz_code with 3 concurrent requests (lock chains with share/owner changes). run.sh --deep.
SPECIFICATION Spec
CONSTANTS
  Folders = {1, 2, 3}
  Docs = {1}
  NProcs = 3
  Kinds = {"delete", "movedocs", "unsharef", "unsharedoc", "patchmove", "patchroot"}
  AllTrees = FALSE
  Tree <- TreeOneChild
  AllPlacements = TRUE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = TRUE
  MoveTx = TRUE
  DelLocks = TRUE
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
  NoRawError
  NoIngestFkError
  NoStaleAuthz
  MovesChecked
