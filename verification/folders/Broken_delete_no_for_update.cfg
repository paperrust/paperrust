\* Broken: delete reads the folder without FOR UPDATE (visible_folder(.., false)).
\* Only DeleteHonorsContents (+ sanity) is checked: since move-documents takes FOR SHARE on its target
\* (2026-11-27), BFS first finds a deadlock (move holds FOR SHARE on the folder and waits for the
\* document row the delete removed; the delete's DELETE waits for the FOR SHARE) - also a consequence
\* of the missing FOR UPDATE, not the point here.
SPECIFICATION Spec
CONSTANTS
  Folders = {1, 2, 3}
  Docs = {1, 2}
  NProcs = 2
  Kinds = {"delete", "movedocs", "patchmove", "patchroot"}
  AllTrees = FALSE
  Tree <- TreeOneChild
  AllPlacements = TRUE
  DocIn <- NoDocIn
  UseTreeLock = TRUE
  DelTreeLock = TRUE
  LockAfterCheck = FALSE
  UseRowLock = FALSE
  RepeatableRead = FALSE
  AssignKeyShare = FALSE
  MoveTx = TRUE
  DelLocks = TRUE
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
  DeleteHonorsContents
