\* Broken: tree_lock() removed from patch/delete.
\* Only the cycle property is checked: without the lock a deadlock (40P01 -> 500) is often found first,
\* that one is Broken_no_tree_lock_deadlock.
SPECIFICATION Spec
CONSTANTS
  Folders = {f1, f2, f3, f4}
  Docs = {}
  NProcs = 2
  Kinds = {"patchmove", "patchroot", "delete"}
  AllTrees = TRUE
  Tree <- TreeFlat
  AllPlacements = FALSE
  DocIn <- NoDocIn
  UseTreeLock = FALSE
  DelTreeLock = FALSE
  LockAfterCheck = FALSE
  UseRowLock = TRUE
  RepeatableRead = FALSE
  AssignKeyShare = FALSE
  MoveTx = TRUE
  DelLocks = TRUE
SYMMETRY FolderPerms
INVARIANTS
  TypeOK
  Acyclic
  ParentExists
  DocFolderExists
